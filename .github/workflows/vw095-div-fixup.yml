name: VW095 NVIDIA shader divide-fixup correctness (Windows, no title)
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/victory-shader/src/emit/lower.rs'
      - 'crates/victory-shader/src/emit/mod.rs'
      - '.github/workflows/vw095-div-fixup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  div-fixup:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout is exact source commit
        shell: pwsh
        run: |
          $actual=(& git rev-parse HEAD).Trim()
          $expected='${{ github.event.pull_request.head.sha || github.sha }}'
          if ($actual -cne $expected) { throw 'Not the exact source branch head' }
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install
      - name: CPU-only division fixup lowering regression
        shell: pwsh
        run: cargo test --locked -p victory-shader div_fixup_corner_program_lowers_without_gpu -- --nocapture
      - name: Locked Windows source check
        shell: pwsh
        run: cargo check --locked -p victory
