name: Agent docs integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Required agent documents and continuity anchors
        run: bash scripts/check-agent-docs.sh
