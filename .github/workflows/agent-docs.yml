name: Agent docs integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Required agent documents, continuity anchors and local links
        run: bash scripts/check-agent-docs.sh
      - name: Simulate cold starts, SIGKILL, resume, races, and fail-closed controls
        run: bash scripts/test-agent-restarts.sh
      - name: Negative regression — a broken internal link must fail
        shell: bash
        run: |
          printf '\n[Broken-link regression](this-file-must-never-exist-viw.md)\n' >> docs/agents/README.md
          if bash scripts/check-agent-docs.sh; then
            echo "ERROR: docs checker missed a deliberately broken link" >&2
            exit 1
          fi
